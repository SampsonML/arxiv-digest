[project]
name = "arxiv-digest"
version = "0.4.0"
description = "A daily arXiv digest of the new papers that match your research interests, ranked locally and explained by Claude."
readme = "README.md"
authors = [
    { name = "Matt Wiemann", email = "44228257+SampsonML@users.noreply.github.com" }
]
# The code is MIT; the bundled fonts (Inter, Space Grotesk, JetBrains Mono) are OFL-1.1.
license = "MIT AND OFL-1.1"
license-files = ["LICENSE", "src/arxiv_digest/assets/fonts/LICENSE-*.txt"]
keywords = ["arxiv", "papers", "research", "digest", "claude", "mcp"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# The upper bound is temporary: onnxruntime (needed by fastembed for the local
# embedding model) has no wheels for Python 3.15 yet. uv picks or downloads a
# supported Python automatically, so `uvx arxiv-digest` still works.
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastembed>=0.5",
    "httpx>=0.27",
    "jinja2>=3.1",
    "numpy>=1.26",
    "pypdf>=4",
    "python-multipart>=0.0.9",
    "starlette>=0.40",
    "tomlkit>=0.12",
    "typer>=0.12",
    "tzdata>=2026.6 ; sys_platform == 'win32'",
    "uvicorn>=0.30",
]

[project.scripts]
arxiv-digest = "arxiv_digest.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Starlette suggests a different HTTP client for its test client; tests only.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
