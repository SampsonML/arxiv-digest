<form method="post" action="/run" class="run-form">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <button type="submit" class="primary"{% if job.state == 'running' %} disabled{% endif %}>
    {% if job.state == 'running' %}Running…{% else %}Run today's digest{% endif %}
  </button>
  <label><input type="checkbox" name="use_claude" checked> Let Claude choose and explain</label>
  <label><input type="checkbox" name="include_seen"> Include papers already shown (redo the latest announcement)</label>
</form>
