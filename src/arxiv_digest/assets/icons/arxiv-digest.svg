<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- arxiv-digest app icon: a science test tube under a night sky. Original artwork. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06060e"/>
      <stop offset="0.55" stop-color="#13144a"/>
      <stop offset="1" stop-color="#2a2f8c"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3925a" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#e3925a" stop-opacity="0.7"/>
      <stop offset="0.75" stop-color="#4fc1c9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4fc1c9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd0d6"/>
      <stop offset="0.55" stop-color="#e3925a"/>
      <stop offset="1" stop-color="#c46a32"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>
    <clipPath id="inside">
      <path d="M110 52 V176 a18 18 0 0 0 36 0 V52 Z"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#sky)"/>
  <path d="M-20 170 C 50 128, 140 150, 280 96" fill="none" stroke="url(#trail)" stroke-width="16" filter="url(#soft)"/>
  <path d="M-20 170 C 50 128, 140 150, 280 96" fill="none" stroke="url(#trail)" stroke-width="3" opacity="0.9"/>

  <g transform="rotate(-24 128 128)" filter="url(#glow)">
    <!-- liquid, clipped to the inside of the tube -->
    <g clip-path="url(#inside)">
      <path d="M100 118 C 116 110, 132 126, 156 116 V210 H100 Z" fill="url(#liquid)"/>
      <circle cx="122" cy="150" r="5" fill="#ffffff" opacity="0.55"/>
      <circle cx="134" cy="170" r="3.5" fill="#ffffff" opacity="0.45"/>
      <circle cx="126" cy="182" r="2.5" fill="#ffffff" opacity="0.4"/>
      <circle cx="137" cy="136" r="2.5" fill="#ffffff" opacity="0.5"/>
    </g>
    <!-- glass -->
    <path d="M110 52 V176 a18 18 0 0 0 36 0 V52" fill="url(#glass)" stroke="#eef3f6" stroke-width="5" stroke-linejoin="round"/>
    <rect x="100" y="40" width="56" height="13" rx="6.5" fill="#eef3f6"/>
    <path d="M117 62 V172" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- sparkles -->
  <path d="M190 52 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 Z" fill="#f4f1e8" opacity="0.9"/>
  <path d="M206 98 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5 Z" fill="#9fe3e7" opacity="0.85"/>
  <circle cx="62" cy="62" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="84" cy="40" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="210" cy="190" r="1.5" fill="#ffffff" opacity="0.5"/>
</svg>
